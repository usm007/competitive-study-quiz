<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Option 2 — Minimalist • DocToQuiz • 1200x628</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#0B1220;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.stage{width:1200px;height:628px;flex:none;background:#FFFFFF;color:#0F172A;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 180px 80px;position:relative}

.rule{width:56px;height:5px;background:#B45309;border-radius:3px;margin:0 0 18px}
.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:700;color:#1E3A5F;margin:0 0 12px}
h1{font-family:"Crimson Pro",serif;font-weight:600;font-size:64px;line-height:1.02;margin:0 0 14px;color:#0F172A}
h1 em{font-style:normal;color:#1E3A5F}
.sub{font-size:18px;color:#475569;margin:0 0 30px;max-width:560px;line-height:1.55}
.cta{background:#1E3A5F;color:#fff;font-weight:700;font-size:15px;padding:14px 34px;border-radius:999px;min-height:44px}
.foot{position:absolute;bottom:30px;font-size:12px;letter-spacing:.12em;color:#94A3B8;font-weight:700}
</style></head>
<body><div class="stage" role="img" aria-label="DocToQuiz — turn what you read into practice">
<div class="brand"><span class="mark">Q</span><b>DocToQuiz</b></div>
<div class="rule"></div><p class="eyebrow">STUDY SIMPLER</p>
<h1>Turn what you read <em>into practice.</em></h1>
<p class="sub">Add books, PDFs, and notes. Get questions with answers and clear explanations.</p>
<span class="cta">Start practicing →</span>
<div class="foot">QUESTIONS • ANSWERS • EXPLANATIONS</div></div></body></html>
