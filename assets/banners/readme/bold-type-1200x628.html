<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Option 3 — Bold Type • DocToQuiz • 1200x628</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@700;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#0B1220;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.stage{width:1200px;height:628px;flex:none;background:#0F172A;color:#fff;border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center;padding:64px 90px 72px}
.num{position:absolute;right:-10px;top:-40px;font-family:"Crimson Pro",serif;font-weight:900;font-size:340px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.14)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mark{width:36px;height:36px;border-radius:11px;background:#FBBF24;color:#0F172A;display:grid;place-items:center;font-weight:900;font-size:19px}
.brand b{font-size:23px;color:#fff}
.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:700;color:#FBBF24;margin:0 0 10px}
h1{font-family:"Crimson Pro",serif;font-weight:900;font-size:112px;line-height:.92;margin:0;letter-spacing:-.02em}
h1 em{font-style:normal;color:#FBBF24}
.row{display:flex;align-items:center;gap:28px;margin-top:24px}
.sub{font-size:17px;color:#CBD5E1;max-width:520px;margin:0;line-height:1.5}
.cta{margin-left:auto;flex:none;background:#FBBF24;color:#0F172A;font-weight:700;font-size:15px;padding:15px 32px;border-radius:999px;min-height:44px}
.bar{position:absolute;left:0;bottom:0;height:10px;width:100%;background:linear-gradient(90deg,#B45309,#FBBF24)}
</style></head>
<body><div class="stage" role="img" aria-label="DocToQuiz — read it, practice it">
<div class="num">Q</div>
<div class="brand"><span class="mark">Q</span><b>DocToQuiz</b></div>
<p class="eyebrow">QUESTIONS WITH ANSWERS</p>
<h1>Read it.<br><em>Practice it.</em></h1>
<div class="row"><p class="sub">Drop in books, PDFs, and notes. Get practice questions with answers and clear explanations.</p><span class="cta">Start →</span></div>
<div class="bar"></div></div></body></html>
