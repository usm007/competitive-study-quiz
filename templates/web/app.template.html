<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Exam Quiz</title>
<style>
:root{--ink:#1a1a1a;--muted:#555;--line:#ccc;--bg:#fff;--panel:#f6f6f6;--accent:#1a5276;--good:#1e7e34;--bad:#a61c1c;--mark:#8a6d00}
*{box-sizing:border-box}
body{font-family:Georgia,"Nirmala UI","Nirmala Text",serif;color:var(--ink);background:var(--bg);margin:0;line-height:1.5}
header{border-bottom:2px solid var(--ink);padding:12px 16px;background:var(--panel)}
header h1{font-size:1.25rem;margin:0 0 4px 0}
.statusline{font-size:.85rem;color:var(--muted)}
.progress{font-size:.9rem;margin-top:4px}
main{display:flex;flex-wrap:wrap;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
#quizcol{flex:3 1 480px;min-width:280px}
#sidecol{flex:1 1 220px;min-width:200px}
.panel{border:1px solid var(--line);padding:12px;margin-bottom:12px;background:var(--bg)}
.panel h2{font-size:1rem;margin:0 0 8px 0;border-bottom:1px solid var(--line);padding-bottom:4px}
label{display:block;margin:4px 0}
select,input[type=text]{max-width:100%;font:inherit}
.opt{display:block;border:1px solid var(--line);padding:8px;margin:6px 0;cursor:pointer}
.opt:hover{background:#f0f4f8}
.opt input{margin-right:8px}
.opt.correct{border-color:var(--good);background:#eaf6ec}
.opt.wrong{border-color:var(--bad);background:#fbeaea}
button{font:inherit;padding:6px 12px;margin:4px 4px 4px 0;cursor:pointer;background:var(--accent);color:#fff;border:1px solid var(--accent)}
button.ghost{background:#fff;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.feedback{border:1px solid var(--line);background:#fafafa;padding:10px;margin-top:10px}
.feedback .row{margin:4px 0}
.kv{font-size:.9rem;color:var(--muted)}
#navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px}
#navgrid button{padding:6px 0;margin:0;text-align:center;background:#fff;color:var(--ink);border:1px solid var(--line)}
#navgrid button.cur{outline:2px solid var(--accent)}
#navgrid button.done{background:#dfe9f3}
#navgrid button.right{background:#d9efdd}
#navgrid button.wrongb{background:#f5d9d9}
#navgrid button.marked{border-bottom:3px solid var(--mark)}
.hintbox{display:none;border-left:3px solid var(--mark);padding:6px 10px;margin:8px 0;background:#fffae6}
.srcbox{display:none;font-size:.85rem;color:var(--muted);margin-top:6px}
.confrow label{display:inline-block;margin-right:10px;font-size:.9rem}
table.analytics{border-collapse:collapse;width:100%;font-size:.9rem;margin:8px 0}
table.analytics th,table.analytics td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px}
.toolbar button.active{background:#0d3a57}
#timer{font-weight:bold}
footer{border-top:1px solid var(--line);padding:10px 16px;font-size:.8rem;color:var(--muted)}
@media (max-width:700px){main{padding:8px}header h1{font-size:1.05rem}}
@media print{.toolbar,#sidecol .panel.controls,#navgrid,button,#timerrow{display:none!important}main{display:block}}
</style>
</head>
<body>
<header>
<h1 id="apptitle">Exam Quiz</h1>
<div class="statusline" id="statusline"></div>
<div class="progress" id="progress"></div>
<div id="timerrow" style="display:none">Time left: <span id="timer"></span></div>
</header>
<main>
<div id="quizcol">
<div class="toolbar" id="modebar" role="tablist" aria-label="Modes">
<button data-mode="learn">Learn</button>
<button data-mode="practice">Practice</button>
<button data-mode="test">Test (timed)</button>
<button data-mode="revision">Revision</button>
<button data-mode="rapid">Rapid Recall</button>
<button id="analyticsBtn" class="ghost">Analytics</button>
<button id="quizBtn" class="ghost" style="display:none">Back to quiz</button>
<label style="display:inline;font-size:.85rem"><input type="checkbox" id="srcmode"> Source mode</label>
<a href="#" id="printlink" onclick="window.print();return false;">Print</a>
</div>
<div id="quizview">
<div class="panel">
<div class="kv" id="qmeta"></div>
<h2 id="qstem" style="border:none;font-size:1.05rem"></h2>
<div id="qstatements"></div>
<div id="qhint"><button class="ghost" id="hintbtn" type="button">Show hint</button><div class="hintbox" id="hintbox"></div></div>
<form id="opts"></form>
<div class="confrow" id="confrow"><span>Confidence: </span>
<label><input type="radio" name="conf" value="Certain"> Certain</label>
<label><input type="radio" name="conf" value="Fairly confident"> Fairly confident</label>
<label><input type="radio" name="conf" value="Unsure"> Unsure</label>
<label><input type="radio" name="conf" value="Guessing" checked> Guessing</label>
</div>
<div style="margin-top:8px">
<button id="submitbtn" type="button">Submit</button>
<button id="markbtn" type="button" class="ghost">Mark for revisit</button>
<button id="prevbtn" type="button" class="ghost">← Prev</button>
<button id="nextbtn" type="button" class="ghost">Next →</button>
</div>
<div class="feedback" id="feedback" style="display:none"></div>
</div>
</div>
<div id="analyticsview" style="display:none">
<div class="panel"><h2>Analytics</h2><div id="analytics"></div></div>
</div>
</div>
<div id="sidecol">
<div class="panel controls"><h2>Filters</h2>
<label>Topic <select id="f_topic"><option value="">All</option></select></label>
<label>Difficulty <select id="f_diff"><option value="">All</option></select></label>
<label>Tier <select id="f_tier"><option value="">All</option></select></label>
<label>Type <select id="f_type"><option value="">All</option></select></label>
<label><input type="checkbox" id="f_incorrect"> Incorrect only</label>
</div>
<div class="panel"><h2>Navigator</h2><div id="navgrid"></div>
<div class="kv">Click a number to jump. ★ = marked.</div></div>
<div class="panel"><h2>Session</h2>
<button id="exportbtn" class="ghost" type="button">Export session JSON</button>
<button id="importbtn" class="ghost" type="button">Import session JSON</button>
<input type="file" id="importfile" accept="application/json" style="display:none">
<div class="kv" id="storagenote"></div>
</div>
</div>
</main>
<footer><span>Keyboard: 1–4 select option · ←/→ prev/next · Enter submit · M mark. No network use; all data is embedded in this file.</span></footer>
<script>
"use strict";
window.__PACKAGE__ = /*__PACKAGE__*/{};
window.__STATUS__ = /*__STATUS__*/"";
var PKG = window.__PACKAGE__ || {};
var STATUS = window.__STATUS__ || "";
var QUESTIONS = Array.isArray(PKG.questions) ? PKG.questions : [];
var RAWMETA = (PKG.meta && typeof PKG.meta === "object") ? PKG.meta : {};
function covText(c){ if(!c) return ""; if(typeof c==="string") return c;
  try{ if(c.topics&&c.topics.length) return c.topics.length+" topics";
    return Object.keys(c).slice(0,4).map(function(k){return k+": "+c[k];}).join(", ").slice(0,120); }
  catch(e){ return ""; } }
var RAWCOV = (RAWMETA.coverage!==undefined?RAWMETA.coverage:PKG.coverage);
var EXTCT = (RAWMETA.external_count!==undefined?RAWMETA.external_count:
  (function(){ var n=0,has=false; QUESTIONS.forEach(function(q){ if(q&&q.origin==="external"){n++;has=true;} }); return has?n:""; })());
var META = {
  title: RAWMETA.title || PKG.run_id || "Exam Quiz",
  source: RAWMETA.source || PKG.run_id || "?",
  profile: (RAWMETA.profile!==undefined?RAWMETA.profile:(PKG.profile||{})),
  status: RAWMETA.status || PKG.package_status || "unknown",
  coverageText: covText(RAWCOV), externalCount: EXTCT
};
var PROFILE = META.profile || {};
if (typeof PROFILE === "string") PROFILE = { name: PROFILE };
var NEG = (PROFILE && PROFILE.negative_marking) || {};
var PENALTY = (NEG.enabled === false) ? 0 : (typeof NEG.penalty_fraction === "number" ? NEG.penalty_fraction : (typeof PROFILE.penalty_fraction === "number" ? PROFILE.penalty_fraction : 0));
var MARKS_CORRECT = (typeof PROFILE.marks_correct === "number") ? PROFILE.marks_correct : 1;

function letters(n){ var L=[]; for(var i=0;i<n;i++) L.push(String.fromCharCode(65+i)); return L; }
function normOptions(q){
  var o = q.options || q.choices || [];
  if (o.length && typeof o[0] === "string") return o.map(function(t,i){ return {key:String.fromCharCode(65+i), text:t, is_correct:false, confusion_type:""}; });
  return o.map(function(x,i){ return {key: x.key || String.fromCharCode(65+i), text: x.text || x.label || String(x), is_correct: !!x.is_correct, confusion_type: x.confusion_type || ""}; });
}
function normKey(q, opts){
  for (var i=0;i<opts.length;i++) if (opts[i].is_correct) return opts[i].key;
  var a = (q.answer !== undefined ? q.answer : (q.key !== undefined ? q.key : q.correct));
  if (typeof a === "number" && opts[a]) return opts[a].key;
  if (typeof a === "string") { var s=a.trim().toUpperCase(); if (/^[A-F]$/.test(s)) return s; for (var j=0;j<opts.length;j++) if (opts[j].text===a) return opts[j].key; }
  return opts.length ? opts[0].key : "A";
}
function qid(q,i){ return q.id || q.qid || ("Q"+String(i+1).padStart(3,"0")); }
function qtopic(q){ return q.topic || q.knowledge_area || q.subject || "General"; }
function qdiff(q){ return q.difficulty || "Medium"; }
function qtier(q){ return String(q.tier !== undefined ? q.tier : "—"); }
function qtype(q){ return q.type || q.question_type || "MCQ"; }
function fmtSrcRef(s){ if(!s) return ""; if(typeof s==="string") return s;
  return [s.section_path,s.block_id,(s.page?"p."+s.page:""),s.table_ref].filter(Boolean).join(" · "); }
function qsrc(q){ var s=q.source||q.source_ref||""; if(!s) return "";
  if(Object.prototype.toString.call(s)==="[object Array]") return s.map(fmtSrcRef).filter(Boolean).join(" | ");
  return fmtSrcRef(s); }
function qmem(q){ return q.memory_aid || q.memoryAid || q.mnemonic || ""; }
function qconf(q){ return q.confusion_type || q.confusable_with || q.confusion_risk || ""; }

var state = { idx:0, mode:"practice", submitted:false, answers:{}, testEndsAt:null, testFinished:false, srcMode:false };
var session = { answers:{}, mode:"practice" };
var storeKey = "quiz_session_v1_" + ((META.title||"quiz").replace(/\W+/g,"_").slice(0,40));
var storageOK = true;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
catch(e){ storageOK = false; }
function saveSession(){ try { session.answers = state.answers; session.mode = state.mode; localStorage.setItem(storeKey, JSON.stringify(session)); } catch(e){ storageOK=false; } }
function loadSession(){ try { var raw = localStorage.getItem(storeKey); if(raw){ var s=JSON.parse(raw); if(s&&s.answers) state.answers=s.answers; } } catch(e){ storageOK=false; } }
document.getElementById("storagenote").textContent = storageOK ? "Progress auto-saved in this browser." : "Browser storage unavailable; use Export to keep progress.";

function filtered(){
  var t=document.getElementById("f_topic").value, d=document.getElementById("f_diff").value,
      tr=document.getElementById("f_tier").value, ty=document.getElementById("f_type").value,
      io=document.getElementById("f_incorrect").checked;
  return QUESTIONS.map(function(q,i){return i;}).filter(function(i){
    var q=QUESTIONS[i], a=state.answers[qid(q,i)];
    if(t && qtopic(q)!==t) return false;
    if(d && String(qdiff(q))!==d) return false;
    if(tr && qtier(q)!==tr) return false;
    if(ty && qtype(q)!==ty) return false;
    if(io && !(a && !a.correct)) return false;
    if(state.mode==="revision" && !(a && (!a.correct || a.marked))) return false;
    return true;
  });
}
var view = [];
function refreshView(){ view = filtered(); if(state.idx>=view.length) state.idx=0; }
function curQ(){ if(!view.length) return null; return {q:QUESTIONS[view[state.idx]], i:view[state.idx]}; }

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderHeader(){
  document.getElementById("apptitle").textContent = META.title || META.source || "Exam Quiz";
  var cov = META.coverageText ? (" · Coverage: "+META.coverageText) : "";
  var ext = (META.externalCount !== "" ? (" · External: "+META.externalCount) : "");
  document.getElementById("statusline").textContent = "Status: "+(STATUS||META.status||"unknown")+" · Profile: "+(PROFILE.name||"?")+" · Source: "+(META.source||"?")+cov+ext;
  var total = view.length, n = total? state.idx+1:0;
  document.getElementById("progress").textContent = total? ("Question "+n+" of "+total+" · Mode: "+state.mode+(state.mode==="test"&&state.testEndsAt&&!state.testFinished?" · TIMED":"")) : "No questions match filters.";
}
function renderFilters(){
  function fill(id, vals){ var el=document.getElementById(id), cur=el.value; el.innerHTML='<option value="">All</option>'+vals.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>';}).join(""); }
  var T={},D={},R={},Y={};
  QUESTIONS.forEach(function(q){ T[qtopic(q)]=1; D[String(qdiff(q))]=1; R[qtier(q)]=1; Y[qtype(q)]=1; });
  fill("f_topic",Object.keys(T).sort()); fill("f_diff",Object.keys(D).sort());
  fill("f_tier",Object.keys(R).sort()); fill("f_type",Object.keys(Y).sort());
}
function renderNav(){
  var g=document.getElementById("navgrid"); g.innerHTML="";
  view.forEach(function(qi,k){
    var q=QUESTIONS[qi], id=qid(q,qi), a=state.answers[id];
    var b=document.createElement("button"); b.type="button";
    var hideFb = (state.mode==="test" && !state.testFinished);
    b.textContent=(k+1)+(a&&a.marked?"★":"");
    b.className=(k===state.idx?"cur ":"")+(a?(hideFb?"done":(a.correct?"right":"wrongb")):"")+(a&&a.marked?" marked":"");
    b.setAttribute("aria-label","Go to question "+(k+1));
    (function(k){b.onclick=function(){state.idx=k;state.submitted=false;render();};})(k);
    g.appendChild(b);
  });
}
function renderQ(){
  var c=curQ(), fb=document.getElementById("feedback"); fb.style.display="none"; fb.innerHTML="";
  if(!c){ document.getElementById("qstem").textContent="No questions to show."; document.getElementById("opts").innerHTML=""; document.getElementById("qmeta").textContent=""; return; }
  var q=c.q, i=c.i, id=qid(q,i), opts=normOptions(q), key=normKey(q,opts);
  var a=state.answers[id];
  var showFb = !!a && (state.mode!=="test" || state.testFinished);
  document.getElementById("qmeta").textContent = "Q"+(state.idx+1)+" ["+id+"] · "+qtopic(q)+(q.subtopic?" / "+q.subtopic:"")+" · "+qdiff(q)+" · Tier "+qtier(q)+" · "+qtype(q)+(a&&a.marked?" · ★ marked":"");
  document.getElementById("qstem").textContent = q.stem || q.question || "(no stem)";
  var st=document.getElementById("qstatements"); st.innerHTML="";
  var stmts = Array.isArray(q.statements)? q.statements.map(function(s){ return (s&&typeof s==="object")? (s.text||"") : String(s); }).filter(Boolean) : [];
  if(stmts.length){ var ol=document.createElement("ol"); stmts.forEach(function(s){var li=document.createElement("li");li.textContent=s;ol.appendChild(li);}); st.appendChild(ol); }
  var hb=document.getElementById("hintbox"); hb.style.display="none";
  document.getElementById("hintbtn").style.display = q.hint ? "" : "none";
  hb.textContent = q.hint || "";
  var form=document.getElementById("opts"); form.innerHTML="";
  opts.forEach(function(o,k){
    var lab=document.createElement("label"); lab.className="opt";
    if(showFb){ if(o.key===key) lab.className+=" correct"; else if(a.sel===o.key) lab.className+=" wrong"; }
    var r=document.createElement("input"); r.type="radio"; r.name="opt"; r.value=o.key;
    if(a&&a.sel===o.key) r.checked=true;
    r.disabled=!!a;
    r.setAttribute("aria-label","Option "+o.key);
    lab.appendChild(r);
    lab.appendChild(document.createTextNode(o.key+". "+o.text));
    form.appendChild(lab);
  });
  if(a&&a.conf){ var rs=document.getElementsByName("conf"); for(var k=0;k<rs.length;k++) if(rs[k].value===a.conf) rs[k].checked=true; }
  document.getElementById("submitbtn").disabled = !!a;
  document.getElementById("confrow").style.display = a ? "none" : "";
  var hideAll = (state.mode==="test" && !state.testFinished);
  if(state.mode==="learn" && (q.hint)) { hb.style.display="block"; }
  if(showFb && !hideAll){
    fb.style.display="block";
    var yours = a.sel||"—", ok = a.correct;
    var html='<div class="row"><b>'+(ok?"Correct ✓":"Incorrect ✗")+'</b> · Your answer: '+esc(yours)+' · Correct answer: '+esc(key)+'</div>';
    if(q.explanation) html+='<div class="row"><b>Explanation:</b> '+esc(q.explanation)+'</div>';
    html+='<div class="row kv">Knowledge area: '+esc(qtopic(q))+(q.subtopic?" / "+esc(q.subtopic):"")+'</div>';
    if(qmem(q)) html+='<div class="row"><b>Memory aid:</b> '+esc(qmem(q))+'</div>';
    if(qconf(q)) html+='<div class="row kv">Confusion tag: '+esc(Array.isArray(qconf(q))?qconf(q).join(", "):qconf(q))+'</div>';
    if(qsrc(q)) html+='<div class="row"><button type="button" class="ghost" id="srctoggle">Show source</button><div class="srcbox" id="srcbox">'+esc(qsrc(q))+'</div></div>';
    fb.innerHTML=html;
    var st2=document.getElementById("srctoggle"); if(st2){ st2.onclick=function(){ var b=document.getElementById("srcbox"); var on=b.style.display==="block"; b.style.display=on?"none":"block"; st2.textContent=on?"Show source":"Hide source"; }; if(state.srcMode){document.getElementById("srcbox").style.display="block"; st2.textContent="Hide source";} }
  } else if(a && hideAll){
    fb.style.display="block"; fb.innerHTML='<div class="row">Recorded. Feedback is hidden until the test ends.</div>';
  }
}
function selectedOpt(){ var rs=document.getElementsByName("opt"); for(var i=0;i<rs.length;i++) if(rs[i].checked) return rs[i].value; return null; }
function selectedConf(){ var rs=document.getElementsByName("conf"); for(var i=0;i<rs.length;i++) if(rs[i].checked) return rs[i].value; return "Guessing"; }
function submit(){
  var c=curQ(); if(!c) return; var q=c.q,i=c.i,id=qid(q,i);
  if(state.answers[id]) return;
  var sel=selectedOpt(); if(!sel){ alert("Select an option (keys 1–4)."); return; }
  var opts=normOptions(q), key=normKey(q,opts), chosen=null;
  for(var k=0;k<opts.length;k++) if(opts[k].key===sel) chosen=opts[k];
  state.answers[id]={sel:sel,conf:selectedConf(),correct:(sel===key),distype:(chosen&&chosen.confusion_type)||"",marked:(state.answers[id]&&state.answers[id].marked)?true:false,time:new Date().toISOString()};
  saveSession(); render();
  if(state.mode==="rapid"){ setTimeout(function(){ if(state.idx<view.length-1){state.idx++;render();} }, 600); }
}
function render(){ renderHeader(); renderNav(); renderQ(); }
function setMode(m){
  state.mode=m; state.idx=0;
  var tb=document.getElementById("timerrow");
  if(m==="test" && !state.testFinished){
    var perQ=60, n=QUESTIONS.length||1;
    state.testEndsAt=Date.now()+n*perQ*1000;
    tb.style.display="";
  } else { state.testEndsAt=null; tb.style.display="none"; }
  var bs=document.querySelectorAll("#modebar button[data-mode]");
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle("active", bs[i].getAttribute("data-mode")===m);
  saveSession(); refreshView(); render();
  document.getElementById("analyticsview").style.display="none";
  document.getElementById("quizview").style.display=""; document.getElementById("quizBtn").style.display="none";
}
function tick(){
  if(state.mode!=="test"||!state.testEndsAt||state.testFinished) return;
  var ms=state.testEndsAt-Date.now();
  if(ms<=0){ state.testFinished=true; document.getElementById("timerrow").style.display="none"; alert("Time up. Test submitted."); render(); showAnalytics(); return; }
  var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  document.getElementById("timer").textContent=(h?h+"h ":"")+m+"m "+ss+"s";
}
setInterval(tick,1000);
function showAnalytics(){
  document.getElementById("quizview").style.display="none";
  document.getElementById("analyticsview").style.display="";
  document.getElementById("quizBtn").style.display="";
  var ans=state.answers, ids=Object.keys(ans);
  var nC=0,nW=0; ids.forEach(function(id){ if(ans[id].correct)nC++; else nW++; });
  var score=nC*MARKS_CORRECT-nW*PENALTY, max=(QUESTIONS.length||1)*MARKS_CORRECT;
  var acc=ids.length? (100*nC/ids.length):0;
  function grp(fn){ var g={}; QUESTIONS.forEach(function(q,i){ var id=qid(q,i),a=ans[id]; if(!a)return; var k=fn(q,a); (g[k]=g[k]||{n:0,c:0}); g[k].n++; if(a.correct)g[k].c++; }); return g; }
  function tab(g,label){ var ks=Object.keys(g).sort(); if(!ks.length) return "<p>No data yet.</p>";
    var h='<table class="analytics"><tr><th>'+esc(label)+'</th><th>Attempted</th><th>Correct</th><th>Accuracy</th></tr>';
    ks.forEach(function(k){ var r=g[k],p=r.n?Math.round(100*r.c/r.n):0; h+="<tr><td>"+esc(k)+"</td><td>"+r.n+"</td><td>"+r.c+"</td><td>"+p+"%"+(r.n<5?" (small sample, n="+r.n+")":"")+"</td></tr>"; }); return h+"</table>"; }
  var cg={}; ids.forEach(function(id){ var a=ans[id]; if(a.correct)return; var k=a.distype||"unclassified";
    if(k==="unclassified"){ for(var i=0;i<QUESTIONS.length;i++){ var q=QUESTIONS[i]; if(qid(q,i)===id){ var c=qconf(q); k=c?(Array.isArray(c)?c.join(", "):String(c)):"unclassified"; break; } } }
    cg[k]=(cg[k]||0)+1; });
  var ch='<p><b>Score (negative marking):</b> '+score.toFixed(2)+' / '+max.toFixed(2)+' (correct +'+MARKS_CORRECT+', wrong −'+PENALTY+') · <b>Accuracy:</b> '+acc.toFixed(1)+'% ('+nC+'/'+ids.length+' attempted, '+QUESTIONS.length+' total)</p>';
  ch+="<h3>By confidence</h3>"+tab(grp(function(q,a){return a.conf||"Guessing";}),"Confidence");
  ch+="<h3>By topic</h3>"+tab(grp(function(q){return qtopic(q);}),"Topic");
  ch+="<h3>By difficulty</h3>"+tab(grp(function(q){return String(qdiff(q));}),"Difficulty");
  var cks=Object.keys(cg);
  ch+="<h3>Confusion-type counts (incorrect)</h3>"+(cks.length? '<table class="analytics"><tr><th>Type</th><th>Count</th></tr>'+cks.sort().map(function(k){return "<tr><td>"+esc(k)+"</td><td>"+cg[k]+"</td></tr>";}).join("")+"</table>" : "<p>No incorrect answers yet.</p>");
  document.getElementById("analytics").innerHTML=ch;
}
document.getElementById("submitbtn").onclick=submit;
document.getElementById("prevbtn").onclick=function(){ if(state.idx>0){state.idx--;render();} };
document.getElementById("nextbtn").onclick=function(){ if(state.idx<view.length-1){state.idx++;render();} };
document.getElementById("markbtn").onclick=function(){ var c=curQ(); if(!c)return; var id=qid(c.q,c.i); var a=state.answers[id]||{sel:null,conf:null,correct:null,marked:false}; a.marked=!a.marked; if(!a.sel) state.answers[id]=a; saveSession(); render(); };
document.getElementById("hintbtn").onclick=function(){ var b=document.getElementById("hintbox"); var on=b.style.display==="block"; b.style.display=on?"none":"block"; document.getElementById("hintbtn").textContent=on?"Show hint":"Hide hint"; };
["f_topic","f_diff","f_tier","f_type","f_incorrect"].forEach(function(id){ document.getElementById(id).onchange=function(){ state.idx=0; refreshView(); render(); }; });
document.querySelectorAll("#modebar button[data-mode]").forEach(function(b){ b.onclick=function(){ setMode(b.getAttribute("data-mode")); }; });
document.getElementById("analyticsBtn").onclick=showAnalytics;
document.getElementById("quizBtn").onclick=function(){ document.getElementById("analyticsview").style.display="none"; document.getElementById("quizview").style.display=""; document.getElementById("quizBtn").style.display="none"; };
document.getElementById("srcmode").onchange=function(e){ state.srcMode=e.target.checked; renderQ(); };
document.getElementById("exportbtn").onclick=function(){
  var blob=new Blob([JSON.stringify({meta:META,status:STATUS,exported_at:new Date().toISOString(),answers:state.answers},null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="quiz_session.json"; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},5000);
};
document.getElementById("importbtn").onclick=function(){ document.getElementById("importfile").click(); };
document.getElementById("importfile").onchange=function(e){
  var f=e.target.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var s=JSON.parse(r.result); if(s&&s.answers){ state.answers=s.answers; saveSession(); refreshView(); render(); alert("Session imported."); } else alert("No answers found in file."); }catch(err){ alert("Invalid JSON: "+err.message); } };
  r.readAsText(f); e.target.value="";
};
document.addEventListener("keydown",function(e){
  if(e.target&&(e.target.tagName==="SELECT"||e.target.tagName==="INPUT"&&e.target.type==="text")) return;
  if(document.getElementById("quizview").style.display==="none") return;
  if(e.key>="1"&&e.key<="4"){ var rs=document.getElementsByName("opt"); var k=parseInt(e.key,10)-1; if(rs[k]&&!rs[k].disabled){rs[k].checked=true;} }
  else if(e.key==="ArrowRight"){ if(state.idx<view.length-1){state.idx++;render();} }
  else if(e.key==="ArrowLeft"){ if(state.idx>0){state.idx--;render();} }
  else if(e.key==="Enter"){ e.preventDefault(); submit(); }
  else if(e.key==="m"||e.key==="M"){ document.getElementById("markbtn").click(); }
});
loadSession();
renderFilters(); refreshView(); setMode(session.mode||"practice");
document.getElementById("storagenote").textContent = storageOK ? "Progress auto-saved in this browser." : "Browser storage unavailable; use Export to keep progress.";
</script>
</body>
</html>
